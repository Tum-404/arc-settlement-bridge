services:
  bridge:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_KEY=${APP_KEY:-base64:7nJGgx3uJE5PZl9raTEICzvB0nQapJbccLknPnsERgQ=}
      - DB_CONNECTION=${DB_CONNECTION:-pgsql}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_DATABASE=${DB_DATABASE:-settlement}
      - DB_USERNAME=${DB_USERNAME:-settlement}
      - DB_PASSWORD=${DB_PASSWORD:-settlement}
      - SETTLEMENT_PROVIDER=${SETTLEMENT_PROVIDER:-fake}
      - INVOICE_GATEWAY=${INVOICE_GATEWAY:-fake}
      - SOLIDINVOICE_URL=${SOLIDINVOICE_URL:-http://solidinvoice:80}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-settlement}
      POSTGRES_USER: ${DB_USERNAME:-settlement}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-settlement}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-settlement} -d ${DB_DATABASE:-settlement}"]
      interval: 5s
      timeout: 5s
      retries: 5

  solidinvoice:
    image: solidinvoice/solidinvoice:latest
    ports:
      - "8080:80"
    environment:
      - DATABASE_URL=pgsql://${DB_USERNAME:-settlement}:${DB_PASSWORD:-settlement}@db:5432/settlement
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
